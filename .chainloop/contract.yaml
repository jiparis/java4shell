apiVersion: chainloop.dev/v1
kind: Contract
metadata:
  name: java4shell
spec:
  materials:
    # The container image built by the workflow. It is the subject of the attestation.
    - type: CONTAINER_IMAGE
      name: image
      output: true
    # CycloneDX SBOM of the image, generated by syft
    - type: SBOM_CYCLONEDX_JSON
      name: sbom
    # Vulnerability scan of the SBOM, generated by grype
    - type: SARIF
      name: vulnerability-scan
  policies:
    materials:
      # Built-in policy. It fails on vulnerabilities at or above the severity threshold.
      - ref: vulnerabilities
        with:
          severity: HIGH
  runner:
    type: GITHUB_ACTION
